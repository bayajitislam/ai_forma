name: ai_forma
description: "AiFORMA - AI Physique Intelligence"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+10

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # UI & Design System
  # Google Fonts: Nunito font typography themes and runtime/local asset font loading
  google_fonts: ^8.1.0
  # Remix Icon: Vector icon pack used for headers, dashboard cards, navigation, and action buttons
  remixicon: ^4.9.3
  # Flutter SVG: High-performance rendering of vector SVG assets (icons, brand badges, status indicators)
  flutter_svg: ^2.3.0
  # Cached Network Image: Remote image loading with persistent disk caching and shimmer/loading placeholders
  cached_network_image: ^3.4.1
  # FL Chart: Interactive line charts and metric graphs for body composition and weight trends
  fl_chart: ^1.2.0

  # State Management & Architecture
  # GetX: Unified reactive state management, dependency injection, and declarative route navigation
  get: ^4.7.3
  # Dartz: Functional programming primitives (Either, Left, Right) for robust failure/success handling
  dartz: ^0.10.1

  # Networking & APIs
  # Dio: Robust HTTP client with interceptors, global timeouts, token renewal, and multipart image uploads
  dio: ^5.11.0
  # Flutter DevLog: Colored HTTP request/response console logging for development and debugging
  flutter_devlog: ^0.3.0

  # Storage & Security
  # Flutter Secure Storage: Hardware-backed encryption (KeyStore / Keychain) for JWT access/refresh tokens
  flutter_secure_storage: ^11.2.0
  # Shared Preferences: Fast key-value persistence for non-sensitive user profile, flags, and settings
  shared_preferences: ^2.5.5

  # Camera & Image Processing
  # Camera: Direct hardware camera preview and high-resolution photo capture for 3-angle body scans
  camera: ^0.12.0+2
  # Image: Raw image decoding, rotation correction, and EXIF processing before server analysis
  image: ^4.5.2
  # Image Picker: System gallery/camera photo selector for profile picture customization
  image_picker: ^1.2.3

  # Firebase & Push Notifications
  # Firebase Core: Foundation plugin required to initialize all Firebase SDK services
  firebase_core: ^3.12.1
  # Firebase Messaging: FCM push notification handling, background handlers, and APNs token syncing
  firebase_messaging: ^15.2.4
  # Firebase Crashlytics: Real-time fatal/non-fatal crash analytics, user ID mapping, and crash reporting
  firebase_crashlytics: ^4.3.10

  # Device & System Utilities
  # Permission Handler: Manages runtime OS permissions (Notifications, Camera) and opens app settings
  permission_handler: ^13.0.2
  # URL Launcher: Opens external web links in device browser (Privacy Policy, Terms of Service)
  url_launcher: ^6.3.1
  # Flutter Timezone: Queries device's native IANA timezone for accurate scheduling and local timestamps
  flutter_timezone: ^5.1.0
  # Intl: Internationalization and locale-aware date, time, and number formatting
  intl: ^0.20.3
  # UUID: Generates RFC4122 unique session and request identifiers for check-in scans
  uuid: ^4.6.0

dev_dependencies:
  # Flutter Test: Core testing framework for unit, mock, and widget tests
  flutter_test:
    sdk: flutter

  # Flutter Lints: Official recommended Dart and Flutter static analysis lint rules
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/app/
    - assets/preview/
    - assets/Icons/
    - assets/fonts/Nunito/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito/Nunito-Light.ttf
          weight: 300
        - asset: assets/fonts/Nunito/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito/Nunito-Black.ttf
          weight: 900
        - asset: assets/fonts/Nunito/Nunito-Italic.ttf
          style: italic
        - asset: assets/fonts/Nunito/Nunito-BoldItalic.ttf
          weight: 700
          style: italic

